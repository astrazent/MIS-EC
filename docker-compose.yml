
services:
  mariadb_db:
    image: mariadb:latest
    container_name: mariadb_db_container
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=webquanao
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - "3306" # chỉ dùng nội bộ Docker

  webquanao_app:
    build:
      context: ./webquanao
      dockerfile: Dockerfile
    container_name: webquanao_app_container
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./webquanao:/var/www/html
    environment:
      - MYSQL_HOST=mariadb_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=webquanao

volumes:
  mariadb_data: